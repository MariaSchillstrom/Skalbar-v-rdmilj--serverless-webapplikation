<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Svampregistret</title>
</head>
<body>
    <h1>Välkommen till Svampregistret!</h1>
    
    <p id="greeting">Loading...</p>
    
    <script>
        async function fetchGreeting() {
            const response = await fetch('https://wtzkv4yiae.execute-api.eu-west-1.amazonaws.com/default/Svampregister');
            const responseBody = await response.text();
            document.getElementById('greeting').innerText = responseBody;
        }
        fetchGreeting();
    </script>
</body>
</html>
